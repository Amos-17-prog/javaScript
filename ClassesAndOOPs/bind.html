<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React</title>
</head>

<body>
    <button>Button Clicked</button>
</body>
<script>
    class React {
        constructor() {
            this.library = "React"
            this.server = "http://localhost:3000"

            // Requirement
            document.querySelector("button")
                .addEventListener("click", this.handleClicked.bind(this))
        }

        handleClicked() {
            console.log("Button Clicked!");
            console.log(this); // Has the refrence
            console.log(this.server); // Refrence is lost if bind(this) is not included
            // console.log(this.library);
        }
    }

    const app = new React()
</script>

</html>
